​/
* Geographic and logic regions for MLBB dedicated gaming servers.
*/
enum class ServerRegion(
val displayName: String,
val flagIcon: String,
val description: String
) {
CIS("СНГ / Россия", "🇷🇺", "Низкий пинг для РФ, Казахстана, Беларуси и ЦА"),
EUROPE("Европа (West/East)", "🇪🇺", "Высокая стабильность и серверы Франкфурта/Амстердама"),
ASIA("Юго-Восточная Азия", "🇸🇬", "Серверы Сингапура, Индонезии и Филиппин"),
