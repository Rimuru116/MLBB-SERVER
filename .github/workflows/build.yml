)
​/
* Application visual theme options.
*/
enum class AppTheme(val title: String, val description: String) {
NAVY_CYBER("Navy Cyber", "Темно-синий игровой стиль с неоново-голубыми акцентами"),
NEON_CYBERPUNK("Cyberpunk Neon", "Футуристический фиолетово-розовый контрастный режим"),
