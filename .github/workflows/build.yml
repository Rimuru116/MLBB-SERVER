MIDDLE_EAST("Ближний Восток", "🇦🇪", "Серверы Дубая и Эр-Рияда"),
CUSTOM("Пользовательские", "⚙️", "Персональные IP и подсети, добавленные вручную")
}
​/
* Detailed entity representing an MLBB server node.
*/
data class ServerNode(
val id: String,
val name: String,
val region: ServerRegion,
val cidr: String,
val hostForPing: String,
val flag: String,
val city: String,
