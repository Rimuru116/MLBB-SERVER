package com.example.serverselector.network
​import kotlinx.coroutines.Dispatchers
import kotlinx.coroutines.delay
import kotlinx.coroutines.withContext
import java.net.InetAddress
​/
* Utility for performing system Traceroute and ICMP Ping tests.
*/
object NetTools {
​suspend fun traceroute(host: String, maxHops: Int = 8): String = withContext(Dispatchers.IO) {
val sb = StringBuilder()
sb.append("=== TRACEROUTE ENGINE 3.0 ===\n")
sb.append("Целевой хост: $host\n\n")
​try {
val address = InetAddress.getByName(host)
sb.append("Разрешенный IP: ${address.hostAddress}\n")
sb.append("Узел\tВремя\tМаршрутизатор\n")
sb.append("----------------------------------\n")
​var destinationReached = false
​for (ttl in 1..maxHops) {
val startTime = System.currentTimeMillis()
val process = Runtime.getRuntime().exec(arrayOf("ping", "-c", "1", "-t", ttl.toString(), host))
