​cat > app/src/main/java/com/example/serverselector/network/IpFilterLogic.kt <<'EOF'
package com.example.serverselector.network
​import java.net.InetAddress
​/
* High-performance CIDR subnet calculator and IP packet filter.
*/
object IpFilterLogic {
​data class CidrBlock(val ipInt: Long, val maskBits: Int) {
val mask: Long = if (maskBits == 0) 0L else (0xFFFFFFFFL shl (32 - maskBits)) and 0xFFFFFFFFL
​fun contains(ipLong: Long): Boolean {
return (ipLong and mask) == (ipInt and mask)
}
}
​@Volatile
private var allowedSubnets: List<CidrBlock> = emptyList()
​fun setAllowedServers(cidrStrings: List<String>) {
allowedSubnets = cidrStrings.mapNotNull { parseCidr(it) }
}
​fun isAllowed(ip: String): Boolean {
val targetLong = ipToLong(ip) ?: return false
if (allowedSubnets.isEmpty()) return true
return allowedSubnets.any { block -> block.contains(targetLong) }
}
​fun parseCidr(cidr: String): CidrBlock? {
return try {
val trimmed = cidr.trim()
val parts = trimmed.split("/")
val ipLong = ipToLong(parts[0]) ?: return null
val mask = if (parts.size > 1) parts[1].toInt().coerceIn(0, 32) else 32
CidrBlock(ipLong, mask)
} catch (e: Exception) {
null
}
}
​fun ipToLong(ip: String): Long? {
return try {
val bytes = InetAddress.getByName(ip.trim()).address
if (bytes.size != 4) return null
var res = 0L
for (b in bytes) {
res = (res shl 8) or (b.toLong() and 0xFF)
}
res and 0xFFFFFFFFL
} catch (e: Exception) {
null
}
}
​fun longToIp(ipLong: Long): String {
return "{(ipLong shr 24) and 0xFF}.{(ipLong shr 16) and 0xFF}.{(ipLong shr 8) and 0xFF}.{ipLong and 0xFF}"
}
}
