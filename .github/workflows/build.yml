import androidx.compose.runtime.Composable
import androidx.compose.runtime.LaunchedEffect
import androidx.compose.runtime.collectAsState
import androidx.compose.runtime.getValue
import androidx.compose.runtime.mutableStateListOf
import androidx.compose.runtime.mutableStateOf
import androidx.compose.runtime.remember
import androidx.compose.runtime.setValue
import androidx.compose.ui.Modifier
import com.example.serverselector.data.DnsRepository
import com.example.serverselector.data.ServerRepository
import com.example.serverselector.model.AppTheme
import com.example.serverselector.model.DnsProvider
import com.example.serverselector.model.PingPoint
import com.example.serverselector.model.ServerNode
import com.example.serverselector.network.PingEngine
import com.example.serverselector.network.TrafficAnalyzer
import com.example.serverselector.service.ServerVpnService
import com.example.serverselector.ui.screens.BoosterScreen
import com.example.serverselector.ui.screens.DnsScreen
import com.example.serverselector.ui.screens.HomeScreen
import com.example.serverselector.ui.screens.PingMonitorScreen
import com.example.serverselector.ui.screens.ServersScreen
import com.example.serverselector.ui.screens.SettingsScreen
import com.example.serverselector.ui.theme.MLBBServerProTheme
import kotlinx.coroutines.delay
​class MainActivity : ComponentActivity() {
​private var pendingAction: (() -> Unit)? = null
​private val vpnPermissionLauncher = registerForActivityResult(ActivityResultContracts.StartActivityForResult()) { result ->
if (result.resultCode == RESULT_OK) {
pendingAction?.invoke()
} else {
Toast.makeText(this, "Доступ VPN необходим для перенаправления трафика", Toast.LENGTH_SHORT).show()
}
pendingAction = null
}
​override fun onCreate(savedInstanceState: Bundle?) {
super.onCreate(savedInstanceState)
​val trafficAnalyzer = TrafficAnalyzer()
​setContent {
var currentTheme by remember { mutableStateOf(AppTheme.NAVY_CYBER) }
var isVpnActive by remember { mutableStateOf(false) }
var selectedServer by remember { mutableStateOf<ServerNode?>(ServerRepository.allServers.first()) }
var activeDns by remember { mutableStateOf<DnsProvider>(DnsRepository.dnsProviders.first()) }
var currentTab by remember { mutableStateOf(0) }
​val pingHistory = remember { mutableStateListOf<PingPoint>() }
​// Ping Collector loop
LaunchedEffect(selectedServer) {
selectedServer?.let { server ->
val engine = PingEngine(server.hostForPing)
engine.startContinuousPing(1000).collect { point ->
pingHistory.add(point)
if (pingHistory.size > 30) pingHistory.removeAt(0)
}
}
}
​// Traffic Booster Simulator loop
LaunchedEffect(isVpnActive) {
while (true) {
trafficAnalyzer.updateTick(isVpnActive)
delay(1000)
}
}
​MLBBServerProTheme(appTheme = currentTheme) {
Surface(modifier = Modifier.fillMaxSize()) {
Scaffold(
bottomBar = {
NavigationBar {
NavigationBarItem(
selected = currentTab == 0,
onClick = { currentTab = 0 },
icon = { Icon(Icons.Filled.Home, contentDescription = null) },
label = { Text("Главная") }
)
NavigationBarItem(
selected = currentTab == 1,
onClick = { currentTab = 1 },
icon = { Icon(Icons.Filled.Router, contentDescription = null) },
label = { Text("Серверы") }
)
NavigationBarItem(
selected = currentTab == 2,
onClick = { currentTab = 2 },
icon = { Icon(Icons.Filled.Speed, contentDescription = null) },
label = { Text("Пинг") }
)
NavigationBarItem(
selected = currentTab == 3,
onClick = { currentTab = 3 },
icon = { Icon(Icons.Filled.Dns, contentDescription = null) },
label = { Text("DNS") }
)
NavigationBarItem(
selected = currentTab == 4,
onClick = { currentTab = 4 },
icon = { Icon(Icons.Filled.MonitorWeight, contentDescription = null) },
label = { Text("Бустер") }
)
NavigationBarItem(
selected = currentTab == 5,
onClick = { currentTab = 5 },
icon = { Icon(Icons.Filled.Settings, contentDescription = null) },
label = { Text("Опции") }
)
}
}
) { innerPadding ->
val trafficStats by trafficAnalyzer.stats.collectAsState()
val packetLogs by trafficAnalyzer.packetLogs.collectAsState()
​Surface(modifier = Modifier.padding(innerPadding)) {
when (currentTab) {
0 -> HomeScreen(
isVpnActive = isVpnActive,
activeServer = selectedServer,
pingHistory = pingHistory,
onToggleVpn = {
if (isVpnActive) {
stopVpnService()
isVpnActive = false
} else {
requestVpnAndStart(selectedServer, activeDns) {
isVpnActive = true
}
}
},
onNavigateToServers = { currentTab = 1 }
)
1 -> ServersScreen(
selectedServer = selectedServer,
onServerSelect = { server ->
selectedServer = server
}
)
2 -> PingMonitorScreen(pingHistory = pingHistory)
3 -> DnsScreen(
activeDns = activeDns,
onDnsSelect = { activeDns = it }
)
4 -> BoosterScreen(
stats = trafficStats,
logs = packetLogs,
onResetStats = { trafficAnalyzer.resetStats() }
)
5 -> SettingsScreen(
currentTheme = currentTheme,
onThemeChange = { currentTheme = it }
)
}
}
}
}
}
}
}
​private fun requestVpnAndStart(server: ServerNode?, dns: DnsProvider, onStarted: () -> Unit) {
val intent = VpnService.prepare(this)
if (intent != null) {
pendingAction = {
startVpnServiceInternal(server, dns)
onStarted()
}
vpnPermissionLauncher.launch(intent)
} else {
startVpnServiceInternal(server, dns)
onStarted()
}
}
​private fun startVpnServiceInternal(server: ServerNode?, dns: DnsProvider) {
val intent = Intent(this, ServerVpnService::class.java).apply {
val cidrs = server?.cidr?.let { arrayListOf(it) } ?: arrayListOf()
putStringArrayListExtra(ServerVpnService.EXTRA_ALLOWED_CIDRS, cidrs)
putExtra(ServerVpnService.EXTRA_PRIMARY_DNS, dns.primaryDns)
}
startService(intent)
}
​private fun stopVpnService() {
val intent = Intent(this, ServerVpnService::class.java).apply {
action = ServerVpnService.ACTION_STOP_VPN
}
startService(intent)
}
}
