GAMER_GOLD("Gamer Gold Edition", "Роскошный темно-серый интерфейс с золотым свечением")
}
​/
* Game Booster metrics telemetry.
*/
data class TrafficStats(
val packetsSent: Long = 0,
val packetsReceived: Long = 0,
val bytesSent: Long = 0,
val bytesReceived: Long = 0,
val packetLossRate: Float = 0.0f,
val currentJitterMs: Float = 0.0f,
val bandwidthKbps: Float = 0.0f,
val isBoosterActive: Boolean = false,
val tcpNoDelayEnabled: Boolean = true,
