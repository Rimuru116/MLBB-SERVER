import com.example.serverselector.ui.theme.PingYellow
​/
* Interactive real-time Canvas rendering continuous Ping telemetry line graph.
*/
@Composable
fun PingGraphCanvas(
pingHistory: List<PingPoint>,
modifier: Modifier = Modifier.fillMaxWidth().height(180.dp)
) {
val primaryColor = MaterialTheme.colorScheme.primary
val surfaceColor = MaterialTheme.colorScheme.surface
​Box(
modifier = modifier
.background(surfaceColor, shape = RoundedCornerShape(16.dp))
.padding(16.dp)
) {
Canvas(modifier = Modifier.fillMaxSize()) {
val width = size.width
val height = size.height
if (pingHistory.isEmpty()) return@Canvas
​val maxPing = (pingHistory.maxOfOrNull { it.pingMs } ?: 100f).coerceAtLeast(100f)
val minPing = 0f
​// Draw horizontal target lines (30ms, 80ms)
val line30Y = height - ((30f - minPing) / (maxPing - minPing)) * height
val line80Y = height - ((80f - minPing) / (maxPing - minPing)) * height
​val dashPathEffect = PathEffect.dashPathEffect(floatArrayOf(10f, 10f), 0f)
​drawLine(
color = PingGreen.copy(alpha = 0.4f),
start = Offset(0f, line30Y),
end = Offset(width, line30Y),
pathEffect = dashPathEffect,
strokeWidth = 2f
)
​drawLine(
color = PingYellow.copy(alpha = 0.4f),
start = Offset(0f, line80Y),
end = Offset(width, line80Y),
pathEffect = dashPathEffect,
strokeWidth = 2f
)
​// Build path for smooth ping graph line
val path = Path()
val fillPath = Path()
​val stepX = width / (pingHistory.size - 1).coerceAtLeast(1)
​pingHistory.forEachIndexed { index, point ->
val x = index * stepX
val normalizedY = height - ((point.pingMs - minPing) / (maxPing - minPing)) * height
​if (index == 0) {
path.moveTo(x, normalizedY)
fillPath.moveTo(x, height)
fillPath.lineTo(x, normalizedY)
} else {
val prevX = (index - 1) * stepX
val prevY = height - ((pingHistory[index - 1].pingMs - minPing) / (maxPing - minPing)) * height
val controlX1 = prevX + (x - prevX) / 2
val controlX2 = prevX + (x - prevX) / 2
​path.cubicTo(controlX1, prevY, controlX2, normalizedY, x, normalizedY)
fillPath.cubicTo(controlX1, prevY, controlX2, normalizedY, x, normalizedY)
}
​if (index == pingHistory.size - 1) {
fillPath.lineTo(x, height)
fillPath.close()
}
}
​// Draw gradient fill under line
drawPath(
path = fillPath,
brush = Brush.verticalGradient(
colors = listOf(primaryColor.copy(alpha = 0.35f), Color.Transparent)
)
)
​// Draw graph stroke line
drawPath(
path = path,
color = primaryColor,
style = Stroke(width = 4.dp.toPx())
)
​// Draw trailing glowing circle for current value
val lastPoint = pingHistory.last()
val lastX = (pingHistory.size - 1) * stepX
val lastY = height - ((lastPoint.pingMs - minPing) / (maxPing - minPing)) * height
​val circleColor = when {
lastPoint.pingMs < 40 -> PingGreen
lastPoint.pingMs < 90 -> PingYellow
else -> PingRed
}
​drawCircle(
color = circleColor.copy(alpha = 0.3f),
radius = 12.dp.toPx(),
center = Offset(lastX, lastY)
)
drawCircle(
color = circleColor,
radius = 6.dp.toPx(),
center = Offset(lastX, lastY)
)
}
}
}
