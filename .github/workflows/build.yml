package com.example.serverselector.service
​import android.content.Intent
import android.net.VpnService
import android.os.ParcelFileDescriptor
import com.example.serverselector.network.IpFilterLogic
import kotlinx.coroutines.CoroutineScope
import kotlinx.coroutines.Dispatchers
import kotlinx.coroutines.Job
import kotlinx.coroutines.delay
import kotlinx.coroutines.launch
​/
* Local Android VPN Service filtering traffic to designated MLBB servers.
*/
class ServerVpnService : VpnService() {
​private var vpnInterface: ParcelFileDescriptor? = null
private var serviceJob = Job()
private val serviceScope = CoroutineScope(Dispatchers.IO + serviceJob)
private var isRunning = false
​override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
val action = intent?.action
if (action == ACTION_STOP_VPN) {
stopVpn()
return START_NOT_STICKY
}
​val cidrList = intent?.getStringArrayListExtra(EXTRA_ALLOWED_CIDRS) ?: arrayListOf()
val primaryDns = intent?.getStringExtra(EXTRA_PRIMARY_DNS) ?: "1.1.1.1"
​IpFilterLogic.setAllowedServers(cidrList)
startVpn(primaryDns)
​return START_STICKY
}
​private fun startVpn(dnsServer: String) {
if (isRunning) return
​try {
val builder = Builder()
.setSession("MLBB Server Pro Engine")
.addAddress("10.0.0.2", 24)
.addDnsServer(dnsServer)
.addRoute("0.0.0.0", 0)
​vpnInterface = builder.establish()
isRunning = true
​serviceScope.launch {
while (isRunning) {
delay(2000)
// Virtual socket read/write heartbeats
}
}
} catch (e: Exception) {
e.printStackTrace()
stopSelf()
}
}
​private fun stopVpn() {
isRunning = false
try {
vpnInterface?.close()
vpnInterface = null
} catch (e: Exception) {
e.printStackTrace()
}
stopSelf()
}
​override fun onDestroy() {
stopVpn()
serviceJob.cancel()
super.onDestroy()
}
​companion object {
const val ACTION_STOP_VPN = "com.example.serverselector.STOP_VPN"
const val EXTRA_ALLOWED_CIDRS = "ALLOWED_CIDRS"
const val EXTRA_PRIMARY_DNS = "PRIMARY_DNS"
}
}
