destinationReached = true
sb.append("\n✓ МАРШРУТ УСПЕШНО ПОСТРОЕН!")
break
}
}
delay(120)
}
​if (!destinationReached) {
sb.append("\n⚠ Лимит прыжков ($maxHops) достигнут.")
}
} catch (e: Exception) {
sb.append("\nОшибка выполнения Traceroute: ${e.message}\n")
}
​sb.toString()
}
